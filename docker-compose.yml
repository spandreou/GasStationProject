services:
  gasstation-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID}
        VITE_APP_MODE: ${VITE_APP_MODE:-production}
        VITE_PUBLIC_APP_BASE_DOMAIN: ${VITE_PUBLIC_APP_BASE_DOMAIN:-homelabshare.gr}
        VITE_CENTRAL_PORTAL_DOMAIN: ${VITE_CENTRAL_PORTAL_DOMAIN:-gas.homelabshare.gr}
        VITE_DEFAULT_TENANT_SLUG: ${VITE_DEFAULT_TENANT_SLUG:-bp-kallis}
        VITE_ENABLE_MONTHLY_PDF_ARCHIVE: ${VITE_ENABLE_MONTHLY_PDF_ARCHIVE:-false}
    image: gasstation-shift-manager:bp-kallis
    container_name: gasstation-bp-kallis
    restart: unless-stopped
    ports:
      - "${GASSTATION_FRONTEND_PORT:-8080}:8080"
